spring.application.name=backend

# PostgreSQL / Supabase Configuration
# Usa las variables SUPABASE_DB_URL, SUPABASE_DB_USER y SUPABASE_DB_PASSWORD
# Ejemplo de URL: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/raremarket}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
