spring.application.name=backend

# Supabase Database Configuration
# Obtén estos valores de tu proyecto en Supabase: Settings ? Database
# Opción A (recomendada): URL JDBC completa
SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?user=postgres.svnduqdzxeuqfreyplhx&password=puigcastellar

# Opción B: variables separadas (fallback si no defines SPRING_DATASOURCE_URL)
SUPABASE_HOST=aws-1-eu-west-1.pooler.supabase.com
SUPABASE_PORT=6543
SUPABASE_DATABASE=postgres
SUPABASE_USER=postgres
SUPABASE_PASSWORD=puigcastellar

# Spring
SPRING_DATASOURCE_USERNAME=${SUPABASE_USER}
SPRING_DATASOURCE_PASSWORD=${SUPABASE_PASSWORD}

# Frontend origins allowed to call backend API (comma-separated)
CORS_ALLOWED_ORIGINS=http://localhost:3000

# PostgreSQL Configuration (Supabase)
# Prefer a full JDBC URL when provided.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Comma-separated allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
