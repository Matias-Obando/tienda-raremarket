spring.application.name=backend

# Supabase Database Configuration
# Obt�n estos valores de tu proyecto en Supabase: Settings ? Database
# Opcion A (recomendada): URL JDBC completa
# Nota: en el pooler de Supabase desactivamos server-side prepared statements
# para evitar errores del tipo "prepared statement S_1 already exists".
SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?user=postgres.svnduqdzxeuqfreyplhx&password=puigcastellar&prepareThreshold=0&preferQueryMode=simple

# Opci�n B: variables separadas (fallback si no defines SPRING_DATASOURCE_URL)
SUPABASE_HOST=aws-1-eu-west-1.pooler.supabase.com
SUPABASE_PORT=6543
SUPABASE_DATABASE=postgres
SUPABASE_USER=postgres
SUPABASE_PASSWORD=puigcastellar

# Spring
SPRING_DATASOURCE_USERNAME=${SUPABASE_USER}
SPRING_DATASOURCE_PASSWORD=${SUPABASE_PASSWORD}

# Frontend origins allowed to call backend API (comma-separated)
CORS_ALLOWED_ORIGINS=http://localhost:3000

# PostgreSQL Configuration (Supabase)
# Prefer a full JDBC URL when provided.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preferQueryMode=simple}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Server Configuration
server.port=8081

# Avoid DevTools fork/restart behavior that can end spring-boot:run with exit -1
spring.devtools.restart.enabled=false

# Upload limits (profile avatar)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Comma-separated allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth token configuration (define JWT_SECRET as env var in every environment)
app.auth.token.secret=${JWT_SECRET:dev-only-change-this-secret-immediately}
app.auth.token.ttl-seconds=${JWT_TTL_SECONDS:86400}

# Supabase Storage buckets
app.storage.item-bucket=${SUPABASE_ITEM_BUCKET:item-images}
