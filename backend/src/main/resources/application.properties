spring.application.name=backend

# PostgreSQL Configuration (Supabase)
# Prefer a full JDBC URL when provided; otherwise build it from discrete Supabase vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_HOST:localhost}:${SUPABASE_PORT:5432}/${SUPABASE_DATABASE:postgres}?sslmode=${SSLMODE:disable}}
spring.datasource.username=${SUPABASE_USER:postgres}
spring.datasource.password=${SUPABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
